; Waveshare Universal e-Paper Driver Board (ESP8266, ESP-12F) + 4.2" raw panel 400x300.
; Build: pio run          Flash: pio run -t upload          Logs: pio device monitor

[env:waveshare-esp8266]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    zinggjm/GxEPD2@^1.6.0
build_flags =
    ; Panel generation: V1 (UC8176, GxEPD2_420) is the default.
    ; For a V2 panel (SSD1683, sticker "V2") uncomment the next line.
    ; -D PANEL_420_V2
    ; Old driver-board revision (BUSY on GPIO16): uncomment. Implies no deep sleep (USB power).
    ; -D BOARD_REV_OLD
