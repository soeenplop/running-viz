<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff">
<title>Lauf-Challenge</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  body { display: grid; place-items: center; cursor: pointer; }
  img {
    width: min(100vw, calc(100vh * 4 / 3));
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    background: #fff;
  }
</style>
</head>
<body>
<img id="display" src="/display.png" alt="Lauf-Challenge">
<script>
  // Reload the image every minute; the server answers 304 when nothing changed.
  // The new image is decoded off-screen first, so a bad response never replaces a good one.
  const img = document.getElementById("display");
  let shownUrl = null;
  setInterval(async () => {
    let url = null;
    try {
      const res = await fetch("/display.png", { cache: "no-cache" });
      if (!res.ok) return;
      url = URL.createObjectURL(await res.blob());
      const next = new Image();
      next.src = url;
      await next.decode();
      img.src = url;
      if (shownUrl) URL.revokeObjectURL(shownUrl);
      shownUrl = url;
    } catch {
      // offline or broken image: keep the current one
      if (url) URL.revokeObjectURL(url);
    }
  }, 60_000);

  // Click/tap toggles fullscreen.
  document.body.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  });
</script>
</body>
</html>
