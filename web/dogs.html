<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wer war dabei?">
<title>Wer war dabei?</title>
<style>
  :root {
    --ink: #111; --muted: #777; --line: #ddd; --paper: #fff; --open: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eee; --muted: #999; --line: #333; --paper: #111; --open: #3a3216; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 480px; padding: 16px;
    font: 17px/1.3 -apple-system, system-ui, sans-serif;
    color: var(--ink); background: var(--paper);
  }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  .run { padding: 12px 0; border-top: 1px solid var(--line); }
  .run.open { background: var(--open); margin: 0 -16px; padding: 12px 16px; }
  .head { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .when { font-weight: 600; }
  .note { color: var(--muted); font-size: 15px; }
  .buttons { display: flex; gap: 8px; }
  button {
    flex: 1; padding: 12px; font: inherit; font-weight: 600; border-radius: 10px;
    border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
  }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .5; }
  #msg { color: #c00; min-height: 1.3em; }
</style>
</head>
<body>
<h1>Wer war dabei?</h1>
<p id="msg" role="status"></p>
<div id="runs"></div>
<script>
  // The token comes from the link (#token) and is remembered on this device.
  let token = location.hash.slice(1);
  try {
    if (token) localStorage.setItem("token", token);
    else token = localStorage.getItem("token") || "";
  } catch {}

  const msg = document.getElementById("msg");
  const list = document.getElementById("runs");
  const name = (d) => d.charAt(0).toUpperCase() + d.slice(1);
  const when = (iso) => new Date(iso).toLocaleString("de-DE", {
    timeZone: "Europe/Berlin", weekday: "short", day: "2-digit", month: "2-digit",
    hour: "2-digit", minute: "2-digit",
  });
  const km = (m) => (m / 1000).toFixed(1).replace(".", ",") + " km";

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    });
    if (res.status === 401) throw new Error("Link ungültig – bitte den Link mit Token öffnen.");
    if (!res.ok) throw new Error("Fehler " + res.status + " – bitte nochmal versuchen.");
    return res.json();
  }

  function render(dogs, runs) {
    list.replaceChildren();
    for (const run of runs) {
      const row = document.createElement("div");
      row.className = "run" + (run.eligible && run.dogs === null ? " open" : "");
      const head = document.createElement("div");
      head.className = "head";
      const left = document.createElement("span");
      left.className = "when";
      left.textContent = when(run.start_time);
      const right = document.createElement("span");
      right.textContent = km(run.distance_m);
      head.append(left, right);
      row.append(head);
      if (!run.eligible) {
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = "Laufband / ohne GPS – zählt nicht für die Hunde";
        row.append(note);
      } else {
        const buttons = document.createElement("div");
        buttons.className = "buttons";
        for (const dog of dogs) {
          const b = document.createElement("button");
          b.textContent = name(dog);
          b.setAttribute("aria-pressed", String((run.dogs || []).includes(dog)));
          b.addEventListener("click", () => {
            const before = run.dogs || [];
            save(run, row, before.includes(dog) ? before.filter((d) => d !== dog) : [...before, dog]);
          });
          buttons.append(b);
        }
        const none = document.createElement("button");
        none.textContent = "Keiner";
        none.setAttribute("aria-pressed", String(run.dogs !== null && run.dogs.length === 0));
        none.addEventListener("click", () => save(run, row, []));
        buttons.append(none);
        row.append(buttons);
      }
      list.append(row);
    }
  }

  let state = { dogs: [], runs: [] };

  async function save(run, row, next) {
    row.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try {
      const res = await api("/api/runs/" + run.id + "/dogs", {
        method: "PUT", body: JSON.stringify({ dogs: next }),
      });
      run.dogs = res.dogs;
      msg.textContent = "";
    } catch (e) {
      msg.textContent = e.message;
    }
    render(state.dogs, state.runs);
  }

  (async () => {
    if (!token) {
      msg.textContent = "Kein Token – bitte den Link mit Token öffnen.";
      return;
    }
    try {
      state = await api("/api/runs");
      render(state.dogs, state.runs);
      if (!state.runs.length) msg.textContent = "Noch keine Läufe.";
    } catch (e) {
      msg.textContent = e.message;
    }
  })();
</script>
</body>
</html>
